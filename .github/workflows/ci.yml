name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Direct Make build and test
        run: |
          make clean
          make test
      - name: Configure library only
        run: cmake -S . -B build-library-only -DTI_C54X_BUILD_TESTS=OFF -DTI_C54X_BUILD_EXAMPLES=OFF
      - name: Build library only
        run: cmake --build build-library-only --parallel
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTI_C54X_BUILD_TESTS=ON -DTI_C54X_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$RUNNER_TEMP/ti-c54x-install"
      - name: Consumer package smoke test
        run: |
          cmake -S tests/contract/consumer \
            -B "$RUNNER_TEMP/ti-c54x-consumer-build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ti-c54x-install"
          cmake --build "$RUNNER_TEMP/ti-c54x-consumer-build" --parallel
          "$RUNNER_TEMP/ti-c54x-consumer-build/ti_c54x_consumer_smoke"
      - name: Hosted benchmark smoke
        run: |
          make bench
          cmake -S . -B build-bench-ci -DTI_C54X_BUILD_TESTS=OFF -DTI_C54X_BUILD_BENCHMARKS=ON
          cmake --build build-bench-ci --target ti_c54x_bench --parallel
          ctest --test-dir build-bench-ci -R 'ti_c54x\.bench_smoke' \
            --output-on-failure --no-tests=error

  sanitizers:
    name: clang sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTI_C54X_BUILD_EXAMPLES=ON -DTI_C54X_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
